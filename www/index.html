<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c211c"><title>أناشيدي</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div><small class="kicker">صوتٌ يرافق يومك</small><h1>أناشيدي<span class="brand-dot"></span></h1></div><button class="icon" data-action="settings" aria-label="الإعدادات">☰</button></header>
<main id="app"><div class="empty">جاري تحميل مكتبتك…</div></main>
<section id="mini" hidden><button class="mini-art" data-action="player" aria-label="فتح المشغل">۞</button><button class="mini-title" data-action="player"><b id="miniTitle"></b><small id="miniArtist"></small></button><button class="icon" data-action="toggle" id="miniPlay" aria-label="تشغيل أو إيقاف">▶</button><button class="icon" data-action="next" aria-label="التالي">›</button><div id="miniProgress"></div></section>
<nav><button data-route="home" class="active">⌂<span>الرئيسية</span></button><button data-route="quran">۞<span>القرآن</span></button><button data-route="nasheed">♫<span>الأناشيد</span></button><button data-route="library">▤<span>مكتبتي</span></button></nav>
<dialog id="player"><button class="close" data-action="close">×</button><small class="kicker">تستمع الآن</small><div class="album"><div class="album-ring">۞</div><span>أَنَاشِيدِي</span><small>سكينة في كل لحظة</small></div><h2 id="fullTitle">اختر مقطعًا</h2><p id="fullArtist"></p><p id="playState" class="muted"></p><input id="seek" type="range" min="0" max="1000" value="0" aria-label="موضع التشغيل"><div class="times"><span id="pos">0:00</span><span id="dur">0:00</span></div><div class="controls"><button data-action="back15" aria-label="رجوع 15 ثانية">−15</button><button data-action="previous" aria-label="السابق">‹</button><button class="play-large" id="fullPlay" data-action="toggle" aria-label="تشغيل أو إيقاف">▶</button><button data-action="next" aria-label="التالي">›</button><button data-action="forward15" aria-label="تقدم 15 ثانية">+15</button></div><div class="pills"><button id="repeat" data-action="repeat">تكرار الكل</button><button id="speed" data-action="speed">1×</button><button data-action="sleep">مؤقت النوم</button><button id="currentFav" data-action="currentFav">المفضلة</button><button data-action="currentDownload">تنزيل</button></div><p class="muted" id="sleepLabel"></p></dialog>
<dialog id="sheet"><button class="close" data-action="close">×</button><div id="sheetContent"></div></dialog><div id="toast" role="status" hidden></div><audio id="webAudio" preload="metadata"></audio><script src="app.js"></script></body></html>
